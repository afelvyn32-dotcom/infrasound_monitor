version: '3.8'

services:
  infrasound-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrasound-monitoring-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SIMULATION_ENABLED=true
      - JWT_SECRET=prod_super_secret_infrasound_key_2026
    # Optional persistent volume if connecting external MongoDB:
    # - MONGODB_URI=mongodb://mongo:27017/infrasound_db
    # depends_on:
    #   - mongo

  # Optional local MongoDB service if not using embedded in-memory database:
